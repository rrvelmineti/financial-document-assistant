name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-postgres:
    name: Backend on PostgreSQL (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fda
          POSTGRES_PASSWORD: fda
          POSTGRES_DB: fda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fda:fda@localhost:5432/fda_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Offline tests against PostgreSQL
        working-directory: backend
        run: python -X dev -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: Retrieval evaluation on the three documents (offline)
        if: matrix.python == '3.12'
        run: python evaluation/run_eval.py

  backend-windows:
    name: Backend on Windows (Python 3.12, SQLite)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Offline tests
        working-directory: backend
        run: python -X dev -W error::ResourceWarning -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend (tests, type check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
